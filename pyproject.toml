[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym-pybullet-drones"
version = "2.0.0"
description = "PyBullet Gym environments for single and multi-agent reinforcement learning of quadcopter control"
authors = [{ name = "Jacopo Panerati", email = "jacopo.panerati@utoronto.ca" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.10,<2",
    "transforms3d>=0.4.1,<0.5",
    "matplotlib>=3.7,<4",
    "pytest>=7.3,<10",
    "pybullet>=3.2.5,<4",
    "gymnasium>=1.2,<1.3",
    "stable-baselines3>=2.0.0,<3",
    "control>=0.10.2,<0.11",
    # Defense-scenario runtime (validators, telemetry, UI server)
    "pandas>=2.0",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
repository = "https://github.com/utiasDSL/gym-pybullet-drones"

[tool.hatch.build.targets.wheel]
packages = ["gym_pybullet_drones"]
